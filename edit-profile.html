<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit profile · GiftWise</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Bitter:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/edit-profile.css">
</head>
<body>
<div id="app">
<div id="nav"></div>
<main class="enter">
<a class="back" href="profile.html">← Back</a>
<form id="ef" class="auth card left" novalidate>
  <h1 class="h1s">Edit <em>profile</em></h1>
  <div class="fm">
    <input id="name" placeholder="Full name">
    <input id="email" type="email" placeholder="Email">
    <div class="row"><input id="phone" placeholder="Phone (01XXXXXXXXX)"><select id="gender"><option value="">Gender</option><option>Female</option><option>Male</option><option>Other</option></select></div>
    <textarea id="bio" rows="3" placeholder="About you"></textarea>
    <input id="pw" type="password" placeholder="New password (leave empty to keep current)">
  </div>
  <div class="err" id="err"></div>
  <div class="row"><button class="btn">Save changes</button><a class="btn ghost" href="profile.html">Cancel</a></div>
</form>
</main>
</div>
<script src="js/common.js"></script>

<script src="js/edit-profile.js"></script>
</body>
</html>
