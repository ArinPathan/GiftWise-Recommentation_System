<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · GiftWise</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Bitter:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">

<body>
<div id="app">

<main class="enter">
<a class="back" href="index.html">← Back</a>
<div class="auth">
  <h1>Login</h1>
  <form id="lf" class="fm" novalidate>
    <input id="username" placeholder="username" autocomplete="username">
    <input id="pw" type="password" placeholder="password" autocomplete="current-password">
    <div class="err" id="err">Try demo / demo</div>
    <button class="btn wide">Login</button>
  </form>
  <p>If not registered,<br><a href="register.html"><em>Register</em></a></p>
</div>
</main>
</div>
<script src="js/common.js"></script>

<script src="js/login.js"></script>

</html>
