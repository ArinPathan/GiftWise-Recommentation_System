<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <link rel="stylesheet" href="color.css">
</head>
<body>

    <div class="register-container">

        <!-- Left Section -->
        <div class="welcome-section">
            <h1>Create Your<br><span>Account</span>!</h1>
            <p>Let's get you started!</p>
        </div>

        <!-- Right Section -->
        <div class="form-section">

            <form id="registerForm" novalidate>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName"
                           placeholder="Enter your full name">
                    <span class="error" id="fullNameError"></span>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username"
                           placeholder="Create your own username">
                    <span class="error" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email"
                           placeholder="Enter your email address">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password"
                               placeholder="At least 6 characters">

                        <button type="button" class="eye-button"
                                id="showPassword" aria-label="Show password">
                            👁
                        </button>
                    </div>

                    <span class="error" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword"
                               placeholder="Re-enter your password">

                        <button type="button" class="eye-button"
                                id="showConfirmPassword" aria-label="Show confirm password">
                            👁
                        </button>
                    </div>

                    <span class="error" id="confirmPasswordError"></span>
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <div class="options">

                        <label>
                            <input type="radio" name="gender"
                                   value="Male"> Male
                        </label>

                        <label>
                            <input type="radio" name="gender"
                                   value="Female"> Female
                        </label>

                        <label>
                            <input type="radio" name="gender"
                                   value="Other"> Other
                        </label>

                    </div>

                    <span class="error" id="genderError"></span>
                </div>

                <div class="form-group">
                    <div class="options">
                        <label>
                            <input type="checkbox" id="terms">
                            I agree to the Terms &amp; Conditions
                        </label>
                    </div>

                    <span class="error" id="termsError"></span>
                </div>

                <button type="submit" class="register-button">
                    Register
                </button>

                <p class="login-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

                <p id="result"></p>

            </form>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
