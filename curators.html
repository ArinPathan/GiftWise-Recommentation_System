<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Gift Curators | Giftwise</title>

    <link rel="stylesheet" href="curators.css">
</head>

<body>
    <button id="menuBtn" class="menu-button moved"
            aria-label="Toggle menu">
        &#9776;
    </button>
    <div class="sidebar active" id="sidebar">

        <a href="admin-dashboard.html">Dashboard</a>

        <a href="customers.html">View customer details</a>

        <a href="gift-database.html">Manage gift database</a>

        <a href="categories.html">Manage categories</a>

        <a href="occasions.html">Manage occasions</a>

        <a href="customer-interests.html">
            Manage customer interests
        </a>

        <a href="reviews.html">
            Manage customer rates &amp; reviews
        </a>

        <a href="curators.html" class="active-link">
            Manage gift curators
        </a>

        <a href="login.html" class="logout-link">Logout</a>

    </div>
    <div class="main-content shifted" id="mainContent">
        <div class="page-header">

            <h2>Gift Curators</h2>

            <a href="admin-dashboard.html#profile">

                <img src="admin-profile.png"
                     class="profile-icon"
                     alt="Admin Profile">

            </a>

        </div>
        <div class="search-section">

            <input type="text" id="search"
                   placeholder="Search">

            <button id="mainEditBtn" class="editBtn">
                Edit
            </button>

        </div>
        <div class="curators-container" id="curatorsList">

        </div>

        <p id="searchMessage"></p>

    </div>
    <div id="viewMenu" class="popup-menu hidden">

        <h2>Curator Details</h2>

        <div class="curator-info">

            <p>Full Name:</p>
            <span id="viewName"></span>

            <p>Username:</p>
            <span id="viewUsername"></span>

            <p>Email:</p>
            <span id="viewEmail"></span>

            <p>Gender:</p>
            <span id="viewGender"></span>

        </div>

        <button id="closeViewBtn" class="action-button">
            Close
        </button>

    </div>
    <div id="editMenu" class="popup-menu hidden">

        <h2>Edit Curator</h2>

        <label for="curatorSelect">Select Curator</label>

        <select id="curatorSelect">

            <option value="">Select Curator</option>

        </select>

        <button id="renameBtn" class="action-button">
            Rename
        </button>

        <button id="addBtn" class="action-button">
            Add
        </button>

        <button id="deleteBtn" class="action-button">
            Delete
        </button>

        <button id="updateBtn" class="action-button">
            Update
        </button>

        <button id="closeEditBtn"
                class="action-button cancel-button">
            Cancel
        </button>

    </div>
    <div id="formMenu" class="popup-menu hidden">
        <h2 id="formTitle">Curator Form</h2>
        <form id="curatorForm" novalidate>
            <div class="form-group">

                <label for="fullName">Full Name</label>

                <input type="text" id="fullName">

                <span class="error" id="fullNameError"></span>

            </div>
            <div class="form-group">

                <label for="username">Username</label>

                <input type="text" id="username">

                <span class="error" id="usernameError"></span>

            </div>
            <div class="form-group">

                <label for="email">Email</label>

                <input type="email" id="email">

                <span class="error" id="emailError"></span>

            </div>
            <div class="form-group">

                <label>Gender</label>

                <div class="options">

                    <label>
                        <input type="radio" name="gender"
                               value="Male"> Male
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Female"> Female
                    </label>

                    <label>
                        <input type="radio" name="gender"
                               value="Other"> Other
                    </label>

                </div>

                <span class="error" id="genderError"></span>

            </div>
            <button type="submit" class="action-button">
                Save Details
            </button>
            <button type="button" id="closeFormBtn"
                    class="action-button cancel-button">
                Cancel
            </button>

        </form>

    </div>


    <script src="curators.js"></script>

</body>
</html>
