<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter recipient details · GiftWise</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Bitter:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/recipient.css">
</head>
<body>
<div id="app">
<div id="nav"></div>
<main class="enter">
<div class="wiz">
  <div id="steps" class="stepper"></div>
  <form id="rf" class="card" novalidate>
    <h1 class="h1s">Enter <em>recipient</em> details</h1>
    <p class="m">Who are we finding a gift for?</p>
    <input id="name" placeholder="Full name" autocomplete="off">
    <input id="age" type="number" min="1" max="110" placeholder="Age">
    <div><span class="lab">Gender</span><div id="gender" class="cw"></div></div>
    <div class="err" id="err"></div>
    <div class="row end"><button class="btn">Next →</button></div>
  </form>
</div>
</main>
</div>
<script src="js/common.js"></script>

<script src="js/recipient.js"></script>
</body>
</html>
